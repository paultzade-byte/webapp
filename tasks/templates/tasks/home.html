{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halo Djangogo! — антизлісний клікер</title>
    <link rel="stylesheet" href="{% static 'tasks/css/style.css' %}">
</head>
<body>
    <canvas id="confetti"></canvas>
    <div id="conn" class="conn conn--off" title="WebSocket">● offline</div>

    <main class="layout">
        <section class="card main-card" id="safe-zone">
            <h1>Halo Djangogo!</h1>
            <img src="{% static 'tasks/images/detu.jpg' %}" alt="detu">
            <p class="lead">
                Збережи ім'я у <u>вічності</u>, лови кнопку і разом з усіма
                докликай до <b id="target">100</b>, щоб знизити рівень злості.
                Хто зробить останній клік — той і переміг.
            </p>

            <form id="join-form" class="input-row" autocomplete="off">
                <input type="text" id="name" maxlength="32" placeholder="my name is...">
                <button type="submit" id="join">Save</button>
            </form>
            <p id="me" class="me"></p>

            <div class="anger">
                <div class="anger__label">Рівень злості: <span id="anger-pct">100%</span> <span id="anger-emoji">🤬</span></div>
                <div class="anger__bar"><div id="anger-fill" class="anger__fill"></div></div>
            </div>

            <div class="clicker">
                <div class="clicker__slot">
                    <button type="button" id="clicker" class="big-btn" disabled>Click me</button>
                </div>
                <div id="count" class="count">0</div>
                <div id="combo" class="combo"></div>
            </div>

            <button type="button" id="new-game" class="ghost-btn">НОВА ГРА</button>
        </section>

        <aside class="side">
            <section class="card">
                <h2>Гравці <small id="online"></small></h2>
                <ol id="players" class="players"></ol>
            </section>
            <section class="card">
                <h2>🏆 Зал слави</h2>
                <ol id="hall" class="hall"></ol>
            </section>
        </aside>
    </main>

    <div id="toasts" class="toasts"></div>

    <div id="modal" class="modal" hidden>
        <div class="modal__box">
            <p id="modal-text"></p>
            <button type="button" id="modal-ok">OK</button>
        </div>
    </div>

    <script src="{% static 'tasks/js/app.js' %}"></script>
</body>
</html>
